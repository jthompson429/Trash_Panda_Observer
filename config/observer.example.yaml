camera:
  analysis_width: 640
  analysis_height: 480
  capture_width: 2304
  capture_height: 1296
  analysis_fps: 12
  autofocus_mode: continuous

motion:
  pixel_threshold: 25
  minimum_total_area: 1500
  minimum_largest_region_area: 750
  consecutive_frames: 2
  warmup_seconds: 10
  cooldown_seconds: 15
  blur_kernel_size: 5
  morphology_kernel_size: 3
  background_alpha: 0.02
  region_of_interest: null

capture:
  frames_per_event: 12
  interval_ms: 200
  jpeg_quality: 92
  maximum_pending_events: 2

storage:
  base_path: /home/pi/trash-panda-observer-data
  minimum_free_space_gb: 5

logging:
  level: INFO
  log_to_file: true
  log_path: /home/pi/trash-panda-observer-data/logs/observer.log
  maximum_log_size_mb: 10
  backup_count: 5
  motion_debug_interval_seconds: 5

system:
  camera_retry_count: 3
  camera_retry_delay_seconds: 10
  low_storage_recheck_seconds: 300
